services:
  postgres:
    image: postgres:17.5
    environment: { POSTGRES_USER: fss, POSTGRES_PASSWORD: fss, POSTGRES_DB: fss }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U fss"], interval: 3s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7.4
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, timeout: 3s, retries: 20 }
  moto:
    image: motoserver/moto:5.1.4
    command: ["-H", "0.0.0.0", "-p", "5000"]
    ports: ["5000:5000"]
