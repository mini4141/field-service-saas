{{- if .Values.inCluster.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:17.5
          env:
            - { name: POSTGRES_USER, value: fss }
            - { name: POSTGRES_PASSWORD, value: fss }
            - { name: POSTGRES_DB, value: fss }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: ["pg_isready", "-U", "fss"] }, periodSeconds: 3 }
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - { name: redis, image: "redis:7.4", ports: [{ containerPort: 6379 }] }
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec: { selector: { app: redis }, ports: [{ port: 6379 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: moto }
spec:
  replicas: 1
  selector: { matchLabels: { app: moto } }
  template:
    metadata: { labels: { app: moto } }
    spec:
      enableServiceLinks: false  # k8s would inject MOTO_PORT=tcp://... and moto parses that env var as its port
      containers:
        - { name: moto, image: "motoserver/moto:5.1.4", args: ["-H", "0.0.0.0", "-p", "5000"], ports: [{ containerPort: 5000 }] }
---
apiVersion: v1
kind: Service
metadata: { name: moto }
spec: { selector: { app: moto }, ports: [{ port: 5000 }] }
---
apiVersion: batch/v1
kind: Job
metadata: { name: create-bucket-{{ .Release.Revision }} }
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-bucket
          image: curlimages/curl:8.11.1
          command: ["sh", "-c", "curl -fsS -X PUT http://moto:5000/{{ .Values.config.s3Bucket }}"]
{{- end }}
