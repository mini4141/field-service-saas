name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - name: Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: OpenAPI contract drift check
        run: |
          pnpm --filter @fss/shared build
          pnpm --filter @fss/api build
          pnpm --filter @fss/api-client generate
          git diff --exit-code -- apps/api/openapi.json packages/api-client/src/schema.d.ts
      # lint, typecheck, build, Jest unit, Nest e2e (compose postgres/redis), Vitest, Playwright web + Expo web
      - name: All cloud-free test layers
        run: REPORT_DIR=$PWD/test-reports bash scripts/test-all.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: test-reports
